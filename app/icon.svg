<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Yohanes Alexander monogram. Adapts to the OS colour scheme. At tab sizes (<=48px)
       it scales up 14% and gains a hairline stroke - optical sizing so the serifs
       survive at 16px.

       Two nested groups on purpose. `transform` is a presentation attribute, and a CSS
       `transform` on the same element REPLACES it rather than composing with it - so
       putting the media-query scale on the group that also carries the translate threw
       the whole monogram into the top-left corner at exactly the sizes it matters.
       The outer group places (attribute only); the inner one is all CSS ever touches.

       Placement is the true centre of the 512 box: the paths measure 372.16 x 301.46,
       so (512-372.16)/2 = 69.92 and (512-301.46)/2 = 105.27. The handover file used
       98.74, which sat 13px high. -->
  <style>
    .ya { fill: #000000; color: #000000; transform-box: fill-box; transform-origin: 50% 50%; }
    @media (prefers-color-scheme: dark) { .ya { fill: #F7F6F5; color: #F7F6F5; } }
    @media (max-width: 48px) { .ya { transform: scale(1.14); stroke: currentColor; stroke-width: 8; stroke-linejoin: round; } }
  </style>
  <g transform="translate(69.92 105.27)"><g class="ya">
